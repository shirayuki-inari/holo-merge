# Place this server block in nginx's http context (for example conf.d/default.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /admin {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    # Vite's content-hashed JS and CSS may be cached permanently.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # These filenames can change content between releases.
    location /audio/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location /avatars/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Missing media must return 404, not the HTML page.
    location / {
        try_files $uri $uri/ =404;
    }
}
